[package]
name = "gray-nous-sub"
version = "0.1.3"
edition = "2021"
rust-version = "1.88"
description = "Nous Portal provider sidecar plugin for the gray agent harness"
license = "MIT"

[lib]
name = "nous_sub"
path = "src/lib.rs"

[[bin]]
name = "nous-sub"
path = "src/main.rs"

[dependencies]
gray-acp-bridge = { path = "../gray-acp-bridge" }
gray-openai-compat = { path = "../gray-openai-compat" }
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "2", features = ["json"] }
